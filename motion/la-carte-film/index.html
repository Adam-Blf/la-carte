<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Carte - Maison A.</title>
<style>
  @font-face { font-family: 'Fraunces'; src: url(fonts/fraunces-normal.woff2) format('woff2'); font-weight: 300 600; font-style: normal; font-display: block; }
  @font-face { font-family: 'Fraunces'; src: url(fonts/fraunces-italic.woff2) format('woff2'); font-weight: 300 600; font-style: italic; font-display: block; }
  @font-face { font-family: 'EB Garamond'; src: url(fonts/eb-garamond-normal.woff2) format('woff2'); font-weight: 400 600; font-style: normal; font-display: block; }
  @font-face { font-family: 'EB Garamond'; src: url(fonts/eb-garamond-italic.woff2) format('woff2'); font-weight: 400 600; font-style: italic; font-display: block; }

  html, body { margin: 0; height: 100%; background: #0b0510; overflow: hidden; }
  body { display: grid; place-items: center; }
  #viewport { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; }
  body.render #viewport { position: fixed; left: 0; top: 0; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f6f0e2;
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-kerning: normal; }
  #camera { position: absolute; inset: 0; transform-origin: 960px 540px; }
  .scene { position: absolute; inset: 0; overflow: hidden; display: none; }
  .layer { position: absolute; inset: 0; }
  .abs { position: absolute; }
  .disp { font-family: 'Fraunces', Georgia, serif; font-weight: 300; font-style: italic; line-height: 1.05; font-optical-sizing: auto; }
  .up { font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-style: normal; line-height: 1.1; font-optical-sizing: auto; }
  .body { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; line-height: 1.3; }
  .it { font-style: italic; }
  .sc { font-family: 'EB Garamond', Georgia, serif; font-variant-caps: all-small-caps; letter-spacing: 0.32em; font-weight: 500; }
  .num { font-variant-numeric: lining-nums tabular-nums; }
  .ch { display: inline-block; transform-origin: 50% 100%; }
  .wmask { display: inline-block; overflow: hidden; vertical-align: top; }
  .w { display: inline-block; }
  .center { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  svg { overflow: visible; }

  /* Lecteur (hors rendu) */
  #hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; display: flex; gap: 12px; align-items: center;
         font: 12px/1.2 ui-monospace, monospace; color: #f6f0e2; background: rgba(10,20,34,.9); }
  #hud input { flex: 1; accent-color: #d4a437; }
  #hud button { font: inherit; background: #d4a437; color: #0a1422; border: 0; padding: 4px 10px; cursor: pointer; }
  body.render #hud { display: none; }
</style>
</head>
<body>
  <div id="viewport"><div id="stage"><div id="camera"></div></div></div>
  <div id="hud">
    <button id="play" type="button">Lecture</button>
    <input id="scrub" type="range" min="0" max="50" step="0.001" value="0" aria-label="Position">
    <span id="tc">00:00.00</span>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
